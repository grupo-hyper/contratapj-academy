name: Deploy to GitHub Pages

# Build da PWA (Vite) e publicação no GitHub Pages a cada push na main.
# Requer: Settings -> Pages -> Source = "GitHub Actions" (habilitar uma vez).
# Domínio custom (academy.contratapj.app.br) vem do arquivo public/CNAME.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Permissões que o deploy-pages exige.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; cancela o anterior em andamento.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The environment `deploy` publishes to, written once so the classifier that
  # reads the `deployed/<env>` marker and the step that writes it agree.
  DEPLOY_ENV: github-pages

jobs:
  # Did this push touch anything worth deploying?
  #
  # A commit that changes nothing but markdown cannot change what runs in
  # production, so building and deploying one is waste -- and on repos that cut
  # a release it is worse than waste, because a docs commit bumps a version and
  # tags a release nobody shipped. Measured 2026-09-11: 9 production deploys in
  # this org over 3.5 days were triggered by markdown-only commits.
  #
  # NOTE: `paths-ignore:` on the trigger is the wrong tool here. It would skip
  # the whole workflow including the cleanup job that deletes the merged PR's
  # source branch -- and a head branch left alive is what makes a stacked PR
  # merge into a dead base and report success. The cleanup job stays ungated
  # and tolerates a skipped deploy.
  #
  # The base is the last commit that actually reached this run's environment
  # (`DEPLOY_ENV`), NOT the previous push. `concurrency` drops runs -- it
  # cancels one in progress (`cancel-in-progress: true`) or replaces one still
  # queued (either setting) -- so a code push can end with no deploy at all, and
  # judging the next push by its own range then skips a docs-only push: the
  # code never ships. It happened in contratapj-backend on 2026-09-15, where
  # production sat three merges behind main with every run green. `deploy`
  # marks each commit it ships with the `deployed/<env>` commit status; the
  # base is the newest ancestor carrying it.
  #
  # Fails open to deploying: a manual run, no marker in the last 100 commits,
  # an API error, or a truncated file list all mean code=true.
  changes:
    name: Detect code changes
    permissions:
      contents: read # compares two SHAs via the REST API
      statuses: read # reads the `deployed/<env>` marker off the history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Classify the pushed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail

          # A manual run is somebody asking for a deploy: never skip it.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::notice::Manual run -- deploying."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The newest commit in this push's history that `deploy` marked as
          # shipped to $DEPLOY_ENV. One GraphQL call reads the marker off the
          # last 100 commits; a status other than SUCCESS is not a deploy.
          context="deployed/$DEPLOY_ENV"
          # shellcheck disable=SC2016 # `$owner` etc. are GraphQL variables, not shell ones
          query='query($owner: String!, $name: String!, $expr: String!, $ctx: String!) {
            repository(owner: $owner, name: $name) {
              object(expression: $expr) {
                ... on Commit {
                  history(first: 100) { nodes { oid status { context(name: $ctx) { state } } } }
                }
              }
            }
          }'
          if ! history=$(gh api graphql -f query="$query" \
              -f owner="${REPO%%/*}" -f name="${REPO#*/}" -f expr="$AFTER" -f ctx="$context"); then
            echo "::warning::Could not read the deploy history. Treating as code."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE=$(printf '%s' "$history" | jq -r '[.data.repository.object.history.nodes[]? | select(.status.context.state == "SUCCESS") | .oid] | first // empty')
          if [ -z "$BASE" ]; then
            echo "::warning::No commit in the last 100 carries $context. Treating as code."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Last commit deployed to $DEPLOY_ENV: $BASE"

          # Everything since that commit, not just this push. A re-run of the
          # commit that is already live compares it with itself, finds no files
          # and deploys -- which is what a re-run is for.
          if ! payload=$(gh api "/repos/$REPO/compare/$BASE...$AFTER"); then
            echo "::warning::Could not compare $BASE..$AFTER. Treating as code."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The compare endpoint caps `files` at 300. A truncated list cannot be
          # judged -- the code could be in the part that was cut.
          count=$(printf '%s' "$payload" | jq '.files | length')
          if [ "$count" -ge 300 ]; then
            echo "::warning::Compare returned $count files and may be truncated. Treating as code."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Renames report the new path in `filename` and the original in
          # `previous_filename`; both are judged, so moving a `.ts` onto a `.md`
          # path does not read as documentation.
          files=$(printf '%s' "$payload" | jq -r '.files[]? | .filename, (.previous_filename // empty)')

          if [ -z "$files" ]; then
            echo "::warning::No files changed since $BASE. Treating as code."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'

          if printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Code changed -- deploying."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation only -- skipping the deploy."
          fi

  build:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    env:
      # Valores PÚBLICOS do cliente (o Vite os embute no bundle de qualquer forma).
      # A anon key é role=anon — os dados são protegidos por RLS, não por segredo.
      VITE_SUPABASE_URL: https://xbolgzabgtxzbpskokxj.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhib2xnemFiZ3R4emJwc2tva3hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MDE1OTEsImV4cCI6MjEwMzA3NzU5MX0.Pzw7qHNoIh5_r1Qo9bFBD3F-JtiVl48xWfAXP-RtgE4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # SPA fallback: o Pages não tem rewrite server-side. Servindo 404.html como
      # cópia do index.html, um deep-link (/certificados, /quiz/:id) carrega a app
      # e o React Router resolve a rota no cliente.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's, so the two `deploy-pages`
    # needs are repeated here beside the one this job adds.
    permissions:
      pages: write
      id-token: write
      statuses: write # records the `deployed/<env>` marker on the shipped commit
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.build.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # The marker `changes` reads to find the last commit that is actually
      # live. Written only after the deploy above succeeded, so a deploy that is
      # cancelled or fails before this point is never taken as the base and the
      # next run ships it. Best effort: failing to write it must not turn a
      # successful deploy red -- the cost of a missing marker is one extra
      # deploy on the next push.
      - name: Record the deployed commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="deployed/$DEPLOY_ENV" \
            -f description="Live in $DEPLOY_ENV" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
