name: Deploy gate test

# Runs the deploy gate's regression test against this repository's deploy
# workflow, through the local copy of the action in .github/actions/deploy-gate.
# That copy has to stay byte-identical to grupo-hyper/contratapj-infra's
# deploy-gate/, which contratapj-infra checks daily and on every change there;
# this job proves the copy works and that deploy-pages.yml is wired to it.

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-gate-test.yml"
      - ".github/actions/deploy-gate/**"

permissions:
  contents: read

concurrency:
  group: deploy-gate-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Deploy gate test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Run the gate's regression test against this workflow
        uses: ./.github/actions/deploy-gate
        with:
          mode: test
          workflow: .github/workflows/deploy-pages.yml
